name: Publish patched Alexa image

# Fork-only: publishes the official image of the release this branch is on, with this
# fork's Alexa provider copied over it, as ghcr.io/<owner>/music-assistant-server.
on:
  push:
    branches:
      - stable
    paths:
      - music_assistant/**
      - Dockerfile.alexa
      - .github/workflows/alexa-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository != 'music-assistant/server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Find the Music Assistant release
        id: version
        # Release tags live upstream, not in this fork: fetching upstream's stable branch
        # brings the tags on its history, so a merged release is found without copying tags.
        run: |
          git fetch https://github.com/music-assistant/server.git '+refs/heads/stable:refs/remotes/upstream/stable'
          echo "version=$(git describe --tags --abbrev=0 --match '[0-9]*')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.alexa
          platforms: linux/amd64,linux/arm64
          build-args: MA_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/music-assistant-server:stable
            ghcr.io/${{ github.repository_owner }}/music-assistant-server:${{ steps.version.outputs.version }}-alexa
            ghcr.io/${{ github.repository_owner }}/music-assistant-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
